<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg_2048-classic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b132e"/>
      <stop offset="100%" stop-color="#3a2066"/>
    </linearGradient>
    <radialGradient id="glow_2048-classic" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg_2048-classic)"/>
  <rect width="400" height="300" fill="url(#glow_2048-classic)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Game Icon Artwork -->
  <g><rect x="140" y="90" width="55" height="55" rx="8" fill="#f59e0b"/>
           <text x="167" y="126" font-family="sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">1024</text>
           <rect x="205" y="90" width="55" height="55" rx="8" fill="#e11d48"/>
           <text x="232" y="126" font-family="sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">2048</text></g>

  <!-- Bottom vignette -->
  <rect y="210" width="400" height="90" fill="rgba(8,5,18,0.85)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#f59e0b" stroke-width="2"/>

  <!-- Typography -->
  <text x="20" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">2048 Classic</text>
  <text x="20" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">NUMBER MERGE PUZZLE</text>
</svg>