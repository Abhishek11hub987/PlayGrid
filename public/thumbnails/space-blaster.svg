<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg_space-blaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
    <radialGradient id="glow_space-blaster" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg_space-blaster)"/>
  <rect width="400" height="300" fill="url(#glow_space-blaster)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Game Icon Artwork -->
  <g><polygon points="200,90 225,150 175,150" fill="#38bdf8"/>
           <rect x="196" y="145" width="8" height="20" fill="#f59e0b"/>
           <circle cx="160" cy="80" r="12" fill="#ef4444"/>
           <circle cx="240" cy="80" r="12" fill="#ef4444"/>
           <line x1="200" y1="90" x2="200" y2="40" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/></g>

  <!-- Bottom vignette -->
  <rect y="210" width="400" height="90" fill="rgba(8,5,18,0.85)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Typography -->
  <text x="20" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Space Blaster</text>
  <text x="20" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0ea5e9" letter-spacing="1">RETRO GALAXY SHOOTER</text>
</svg>