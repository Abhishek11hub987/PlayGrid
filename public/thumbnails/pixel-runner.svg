<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg_pixel-runner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140633"/>
      <stop offset="100%" stop-color="#3d1399"/>
    </linearGradient>
    <radialGradient id="glow_pixel-runner" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#854dff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#854dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg_pixel-runner)"/>
  <rect width="400" height="300" fill="url(#glow_pixel-runner)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Game Icon Artwork -->
  <g><rect x="160" y="110" width="40" height="50" rx="6" fill="#0ea5e9"/>
           <rect x="180" y="120" width="16" height="10" rx="2" fill="#fff"/>
           <polygon points="120,200 135,170 150,200" fill="#ef4444"/>
           <polygon points="210,200 225,170 240,200" fill="#ef4444"/>
           <line x1="0" y1="200" x2="400" y2="200" stroke="#854dff" stroke-width="4"/></g>

  <!-- Bottom vignette -->
  <rect y="210" width="400" height="90" fill="rgba(8,5,18,0.85)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#854dff" stroke-width="2"/>

  <!-- Typography -->
  <text x="20" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Pixel Runner</text>
  <text x="20" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#854dff" letter-spacing="1">CYBER ENDLESS RUNNER</text>
</svg>