<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Builder</title>
  <script src="/sdk/playgrid-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #090514;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #gameCanvas {
      background: linear-gradient(180deg, #0b071e 0%, #1f103b 50%, #3d1b6e 100%);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(103,32,255,0.4);
      max-width: 100%;
      max-height: 100%;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      font-weight: 800;
      font-size: 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .msg-box {
      position: absolute;
      background: rgba(13, 9, 26, 0.9);
      border: 2px solid #854dff;
      border-radius: 14px;
      padding: 24px 32px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>FLOOR: <span id="score" style="color: #38bdf8;">0</span></div>
  </div>
  <canvas id="gameCanvas" width="450" height="700"></canvas>

  <div id="msgBox" class="msg-box">
    <h2 style="font-size: 26px; color: #a37aff; margin-bottom: 8px;">TOWER BUILDER</h2>
    <p style="font-size: 14px; color: #ccc; margin-bottom: 16px;">Click, Tap or Space to Place Moving Blocks</p>
    <div style="font-size: 15px; color: #38bdf8; font-weight: 700;">TAP TO START</div>
  </div>

  <script>
    if (window.PlayGrid) PlayGrid.init();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const msgBox = document.getElementById('msgBox');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', dur = 0.1) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const BLOCK_HEIGHT = 32;
    const START_WIDTH = 220;
    let stack = [];
    let currentBlock = null;
    let speed = 4;
    let direction = 1;
    let state = 'WAIT'; // 'WAIT', 'PLAY', 'OVER'
    let score = 0;
    let cameraY = 0;
    let particles = [];

    const COLORS = [
      '#6720ff', '#854dff', '#a37aff', '#0ea5e9', '#38bdf8',
      '#10b981', '#34d399', '#f59e0b', '#fbbf24', '#ec4899'
    ];

    function getColor(index) {
      return COLORS[index % COLORS.length];
    }

    function init() {
      stack = [
        { x: (canvas.width - START_WIDTH) / 2, y: canvas.height - 80, w: START_WIDTH, color: getColor(0) }
      ];
      score = 0;
      speed = 4;
      cameraY = 0;
      particles = [];
      scoreEl.innerText = score;
      spawnBlock();
    }

    function spawnBlock() {
      const prev = stack[stack.length - 1];
      currentBlock = {
        x: 0,
        y: prev.y - BLOCK_HEIGHT,
        w: prev.w,
        color: getColor(stack.length)
      };
      direction = 1;
    }

    function placeBlock() {
      if (state !== 'PLAY') return;

      const prev = stack[stack.length - 1];
      const diff = currentBlock.x - prev.x;

      if (Math.abs(diff) < 4) {
        // Perfect stack!
        currentBlock.x = prev.x;
        playBeep(520 + score * 20, 'triangle', 0.18);
        createSparkles(currentBlock.x + currentBlock.w / 2, currentBlock.y + BLOCK_HEIGHT / 2);
      } else if (diff > 0 && diff < currentBlock.w) {
        // Cut right overhang
        const cutWidth = diff;
        currentBlock.w -= cutWidth;
        playBeep(320 + score * 10, 'sine', 0.1);
      } else if (diff < 0 && Math.abs(diff) < currentBlock.w) {
        // Cut left overhang
        const cutWidth = Math.abs(diff);
        currentBlock.x = prev.x;
        currentBlock.w -= cutWidth;
        playBeep(320 + score * 10, 'sine', 0.1);
      } else {
        // Complete Miss -> Game Over
        gameOver();
        return;
      }

      stack.push(currentBlock);
      score++;
      scoreEl.innerText = score;
      if (score % 6 === 0) speed = Math.min(speed + 0.6, 9);

      // Adjust camera upward
      if (stack.length > 8) {
        cameraY += BLOCK_HEIGHT;
      }

      spawnBlock();
    }

    function createSparkles(x, y) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 20,
          color: '#fbbf24'
        });
      }
    }

    function gameOver() {
      state = 'OVER';
      playBeep(140, 'sawtooth', 0.4);
      msgBox.innerHTML = `
        <h2 style="font-size: 26px; color: #ef4444; margin-bottom: 6px;">GAME OVER</h2>
        <p style="font-size: 18px; color: #fff; margin-bottom: 12px;">Height Reached: <strong>${score}</strong> Floors</p>
        <div style="font-size: 14px; color: #38bdf8; font-weight: 700;">TAP TO REBUILD</div>
      `;
      msgBox.style.display = 'block';

      if (window.PlayGrid) {
        PlayGrid.submitScore(score * 100, { floors: score });
      }
    }

    function handleAction() {
      if (state === 'WAIT' || state === 'OVER') {
        init();
        state = 'PLAY';
        msgBox.style.display = 'none';
      } else if (state === 'PLAY') {
        placeBlock();
      }
    }

    window.addEventListener('pointerdown', handleAction);
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleAction();
      }
    });

    function update() {
      if (state === 'PLAY' && currentBlock) {
        currentBlock.x += speed * direction;
        if (currentBlock.x + currentBlock.w >= canvas.width) {
          currentBlock.x = canvas.width - currentBlock.w;
          direction = -1;
        } else if (currentBlock.x <= 0) {
          currentBlock.x = 0;
          direction = 1;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw Stack
      for (const b of stack) {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, BLOCK_HEIGHT, 4);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Draw Current Moving Block
      if (state === 'PLAY' && currentBlock) {
        ctx.fillStyle = currentBlock.color;
        ctx.beginPath();
        ctx.roundRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT, 4);
        ctx.fill();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Draw particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
