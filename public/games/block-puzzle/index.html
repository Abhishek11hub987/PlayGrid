<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Block Puzzle Master</title>
  <script src="/sdk/playgrid-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0f19; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #canvas { background: #111827; border-radius: 12px; border: 2px solid #3b82f6; box-shadow: 0 0 35px rgba(59,130,246,0.3); }
    .top-bar { position: absolute; top: 14px; font-size: 18px; color: #60a5fa; font-weight: bold; }
    .card { position: absolute; background: rgba(17,24,39,0.95); padding: 24px 36px; border-radius: 12px; border: 2px solid #3b82f6; text-align: center; }
  </style>
</head>
<body>
  <div class="top-bar">SCORE: <span id="scoreText">0</span> · LINES: <span id="linesText">0</span></div>
  <canvas id="canvas" width="450" height="520"></canvas>
  <div id="card" class="card">
    <h2 style="color:#60a5fa;font-size:24px;margin-bottom:8px;">BLOCK PUZZLE</h2>
    <p style="color:#9ca3af;font-size:13px;margin-bottom:12px;">Place falling tetromino blocks & clear rows</p>
    <p style="color:#38bdf8;font-weight:bold;cursor:pointer;">CLICK TO PLAY</p>
  </div>

  <script>
    if (window.PlayGrid) PlayGrid.init();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const linesText = document.getElementById('linesText');
    const card = document.getElementById('card');

    const COLS = 10;
    const ROWS = 14;
    const BLOCK = 30;

    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let score = 0;
    let lines = 0;
    let state = 'WAIT';
    let lastDrop = 0;

    const SHAPES = [
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[0,1,0],[1,1,1]], // T
      [[1,0,0],[1,1,1]], // L
      [[0,0,1],[1,1,1]], // J
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]]  // Z
    ];
    const COLORS = ['#38bdf8', '#facc15', '#a855f7', '#fb923c', '#3b82f6', '#4ade80', '#ef4444'];

    let current = null;

    function newPiece() {
      const idx = Math.floor(Math.random() * SHAPES.length);
      current = {
        shape: SHAPES[idx],
        color: COLORS[idx],
        x: Math.floor(COLS / 2) - 1,
        y: 0
      };
      if (collides(current.x, current.y, current.shape)) {
        state = 'OVER';
        if (window.PlayGrid) PlayGrid.submitScore(score);
        card.innerHTML = '<h2 style="color:#ef4444;margin-bottom:8px;">GAME OVER</h2><p style="color:#fff;margin-bottom:12px;">Score: ' + score + '</p><p style="color:#38bdf8;">PLAY AGAIN</p>';
        card.style.display = 'block';
      }
    }

    function collides(nx, ny, shape) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            const bx = nx + c;
            const by = ny + r;
            if (bx < 0 || bx >= COLS || by >= ROWS) return true;
            if (by >= 0 && board[by][bx]) return true;
          }
        }
      }
      return false;
    }

    function lock() {
      for (let r = 0; r < current.shape.length; r++) {
        for (let c = 0; c < current.shape[r].length; c++) {
          if (current.shape[r][c]) {
            board[current.y + r][current.x + c] = current.color;
          }
        }
      }
      clearLines();
      newPiece();
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== 0)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }
      if (cleared > 0) {
        lines += cleared;
        score += cleared * 100 * cleared;
        scoreText.innerText = score;
        linesText.innerText = lines;
      }
    }

    function rotate(shape) {
      return shape[0].map((_, i) => shape.map(row => row[i]).reverse());
    }

    function move(dx) {
      if (!collides(current.x + dx, current.y, current.shape)) {
        current.x += dx;
      }
    }

    function drop() {
      if (!collides(current.x, current.y + 1, current.shape)) {
        current.y++;
      } else {
        lock();
      }
    }

    window.addEventListener('keydown', e => {
      if (state !== 'PLAY') return;
      if (e.key === 'ArrowLeft') move(-1);
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowDown') drop();
      else if (e.key === 'ArrowUp' || e.code === 'Space') {
        const rotated = rotate(current.shape);
        if (!collides(current.x, current.y, rotated)) {
          current.shape = rotated;
        }
      }
    });

    window.addEventListener('pointerdown', () => {
      if (state === 'WAIT' || state === 'OVER') {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        lines = 0;
        scoreText.innerText = '0';
        linesText.innerText = '0';
        state = 'PLAY';
        card.style.display = 'none';
        newPiece();
      }
    });

    function render() {
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Board
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.strokeStyle = '#1f2937';
          ctx.strokeRect(c * BLOCK + 75, r * BLOCK + 50, BLOCK, BLOCK);
          if (board[r][c]) {
            ctx.fillStyle = board[r][c];
            ctx.fillRect(c * BLOCK + 76, r * BLOCK + 51, BLOCK - 2, BLOCK - 2);
          }
        }
      }

      // Draw active piece
      if (current && state === 'PLAY') {
        ctx.fillStyle = current.color;
        for (let r = 0; r < current.shape.length; r++) {
          for (let c = 0; c < current.shape[r].length; c++) {
            if (current.shape[r][c]) {
              ctx.fillRect((current.x + c) * BLOCK + 76, (current.y + r) * BLOCK + 51, BLOCK - 2, BLOCK - 2);
            }
          }
        }
      }
    }

    function loop(time) {
      if (state === 'PLAY' && time - lastDrop > 700) {
        drop();
        lastDrop = time;
      }
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
