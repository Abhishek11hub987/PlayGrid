<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Retro X</title>
  <script src="/sdk/playgrid-sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #canvas { background: #0f172a; border-radius: 12px; border: 2px solid #22c55e; box-shadow: 0 0 30px rgba(34,197,94,0.25); }
    .score-bar { position: absolute; top: 16px; font-size: 18px; color: #4ade80; }
    .card { position: absolute; background: rgba(15,23,42,0.95); padding: 24px 36px; border-radius: 12px; border: 2px solid #22c55e; text-align: center; }
  </style>
</head>
<body>
  <div class="score-bar">SCORE: <span id="scoreText">0</span></div>
  <canvas id="canvas" width="480" height="480"></canvas>
  <div id="card" class="card">
    <h2 style="color:#4ade80;font-size:24px;margin-bottom:8px;">SNAKE RETRO X</h2>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:12px;">Use Arrow Keys or Swipe to slither</p>
    <p style="color:#facc15;font-weight:bold;cursor:pointer;">CLICK OR PRESS ANY KEY</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const card = document.getElementById('card');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }];
    let dir = { x: 0, y: 0 };
    let apple = { x: 15, y: 15 };
    let score = 0;
    let state = 'WAIT';
    let lastTime = 0;
    const SPEED = 110; // ms per tick

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      score = 0;
      scoreText.innerText = '0';
      spawnApple();
    }

    function spawnApple() {
      apple.x = Math.floor(Math.random() * COUNT);
      apple.y = Math.floor(Math.random() * COUNT);
    }

    function handleInput(dx, dy) {
      if (state === 'WAIT' || state === 'OVER') {
        reset();
        state = 'PLAY';
        card.style.display = 'none';
        return;
      }
      if (dx !== -dir.x && dy !== -dir.y) {
        dir = { x: dx, y: dy };
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') handleInput(0, -1);
      else if (e.key === 'ArrowDown') handleInput(0, 1);
      else if (e.key === 'ArrowLeft') handleInput(-1, 0);
      else if (e.key === 'ArrowRight') handleInput(1, 0);
      else if (state !== 'PLAY') handleInput(1, 0);
    });

    window.addEventListener('pointerdown', () => {
      if (state !== 'PLAY') handleInput(1, 0);
    });

    // Touch swipe
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        handleInput(dx > 0 ? 1 : -1, 0);
      } else {
        handleInput(0, dy > 0 ? 1 : -1);
      }
    });

    function update() {
      if (state !== 'PLAY') return;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }

      // Self collision
      for (const segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat apple
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        scoreText.innerText = score;
        spawnApple();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      state = 'OVER';
      card.innerHTML = '<h2 style="color:#ef4444;font-size:22px;margin-bottom:8px;">GAME OVER</h2><p style="color:#fff;margin-bottom:12px;">Final Score: ' + score + '</p><p style="color:#4ade80;">TAP TO PLAY AGAIN</p>';
      card.style.display = 'block';
      if (window.PlayGrid) PlayGrid.submitScore(score);
    }

    function render() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let x = 0; x < COUNT; x++) {
        for (let y = 0; y < COUNT; y++) {
          ctx.fillRect(x * GRID + 9, y * GRID + 9, 2, 2);
        }
      }

      // Apple
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(apple.x * GRID + GRID/2, apple.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((part, idx) => {
        ctx.fillStyle = idx === 0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function loop(time) {
      if (time - lastTime > SPEED) {
        update();
        lastTime = time;
      }
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
